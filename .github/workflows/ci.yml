name: CI

# 现状：gpui-kit-cpp 无 git remote（本地源码树，见 GPUI.lock），托管 runner 无法拉取，
# 故 bootstrap 构建 / --selftest / --shot / cmd/test-shim.sh 都依赖 GPUI_DIR，跑不了。
# 本工作流覆盖三件自足的事：
#   php    —— PHP 声明层（php -l + Pest/PHPStan，不碰 gpui）
#   docs   —— VitePress 构建（docs/，npm ci + vitepress build，顺带是死链门禁）
#   deploy —— 把构建产物发到 GitHub Pages（只在 main 的 push 上跑）
#   native —— 原生链（vendored 源码 + macOS runner：补丁→amalgam→shim 库→tpc→selftest）
# 为什么原生链要 macOS：gpui.o 是 amalgam 的 arm64 目标码，--selftest 要真开一个窗口。
# --shot/shotdiff 不在这里跑：它抓的是真实在屏 NSView，CI 上没有可依赖的窗口会话，
# 那一刀仍归本地（见 docs/guide/testing.md 的边界说明）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages 一次只该有一个部署在跑；后推的提交取消前一个进行中的部署。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP lint + Pest + PHPStan
    # 钉 24.04 而不是 ubuntu-latest：latest 于 2026-10-19 迁到 Ubuntu 26
    # （actions/runner-images#14748），跟着迁是一次独立的决策，不该顺带发生。
    # 想跟上游走就把这行改回 ubuntu-latest。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.5 不是随手选的：composer.lock 里 swoole/typephp 与 swoole/phpx 要
          # "php >=8.4 <8.6"，php-nano 与 phpunit 13 要 ">=8.4"，而开发机就是 8.5.7。
          # 早先钉 8.3 时 composer install 直接失败（phpunit/phpunit 13.4.1 requires
          # php >=8.4.1 -> your php version (8.3.35)），整条 CI 一步都没跑到。
          php-version: '8.5'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Lint all PHP sources
        run: |
          fail=0
          for f in $(find src tests examples bin php-src -type f \( -name '*.php' -o -name 'gpui' \)); do
            php -l "$f" >/dev/null || { echo "lint fail: $f"; fail=1; }
          done
          # bin/gpui 无扩展名，单独 lint
          php -l bin/gpui >/dev/null || fail=1
          exit $fail

      - name: Pest (FakeBridge, headless)
        run: vendor/bin/pest

      # 帧预算棘轮（Phase 19）。gpui 是 frame-rebuilt 模型：每个脏帧都要重跑 view builder
      # 再 toArray()，把每节点成本从 O(n) 变成 O(n²) 的改动只有这一条门会红——小档没事、
      # 大档越预算越狠。纯 PHP、约 2 秒、不需要 gpui 或编译器，所以放在 php job 里。
      # 机器正忙时可以 GPUI_SKIP_BENCH_TREE=1 显式跳过，但那是逃生阀、不是默认。
      - name: 帧预算棘轮（bench-tree）
        run: php cmd/bench-tree.php --check cmd/bench-tree-budgets.txt

      - name: 构建输入都在版本控制里（审核 P0-1 的常驻门）
        run: php cmd/check-build-inputs.php

      - name: 我们发出的名字都在上游词表里（第三条哑路的哨兵）
        run: php cmd/check-upstream-parity.php --info

      - name: PHPStan (level 5, src)
        run: vendor/bin/phpstan analyse --no-progress

  docs:
    name: VitePress build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与开发机同大版本（本地 v24.x）；换大版本就可能撞 VitePress 的构建期差异。
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # 锚点门是 PHP 脚本（cmd/check-doc-anchors.php），所以这个 job 也得有 PHP；
      # 与 php job 同大版本，别在这儿引入新的解析差异。
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run docs:build

      # 构建产物是 docs/.vitepress/dist（gitignore 掉的那份）。config.mts 里没设
      # ignoreDeadLinks ⇒ vitepress build 会因**死页**失败，所以 Build site 那一步是死页门禁；
      # 但它**不解析 `#fragment`**（2026-10-15 实测放过一根真死锚），锚点归后面那步管。
      # 这一步只把"真的出了页"变成断言，别让空目录混过去。
      - name: Assert built pages
        working-directory: docs
        run: |
          pages=$(find .vitepress/dist -name '*.html' | wc -l)
          echo "built html pages: ${pages}"
          test "${pages}" -gt 0

      # base 必须是 /typephp-gpui/（见 config.mts）：项目页挂在子路径下，
      # base 写成 '/' 会得到"页面在、资源 404"的站——本地看不出来。
      - name: Assert project-page base baked in
        working-directory: docs
        run: grep -q '/typephp-gpui/' .vitepress/dist/index.html

      # vitepress build 查不到的那一半：站内链接的 `#锚点` 必须能在**产物里真实渲染出的
      # id** 上找到（比源码标题字符串可靠：VitePress 生成 id 的规则含中文转写与去重）。
      # 这条门自带防空跑：一条链接都没扫到就 rc=2，别把"没看"当成"看过且干净"。
      - name: Doc anchors resolve against built ids
        run: php cmd/check-doc-anchors.php

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  native:
    name: 原生链（amalgam + shim + AOT selftest）
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          # 与 php job 同版本：lock 里 swoole/typephp 与 phpx 要 ">=8.4 <8.6"。
          php-version: '8.5'
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      # 一条命令跑完整链：同步沙箱 → 8 个补丁 → verifyPatches → bun 生成 amalgam →
      # build-shim 归档 → tpc --nano 出二进制。hello_world 的链接会因入口 main 被改名
      # 而失败（预期），只要 gpui.o 是新的就行。
      - name: Build
        run: php bin/gpui build hello

      # 第 8 个补丁的门禁：上游一刷新就可能静默失配（站点排版变了 → 补丁什么也没做）。
      - name: C++17 parseability of gpui.h
        run: bash cmd/check-cxx17.sh

      - name: C ABI 防火墙仍是纯 C（gpui_shim.h 用 clang -x c 编一遍）
        run: bash cmd/check-c-abi.sh

      - name: C++ shim tests (headless)
        run: bash cmd/test-shim.sh

      # 真编译产物里跑 21 条端到端链路。这一步同时也是"CI 上的 macOS 能不能开窗口"
      # 的实测答案——能过就说明 selftest 这条不需要 self-hosted。
      - name: Native selftest
        run: ./examples/hello/build/hello --selftest

      # bundle 的"在屏资格"两条：主可执行文件是正规文件、签名把 Info.plist 绑进去。
      # 这两条坏掉时**进程内自报（active/key/visible/main）与像素门全都看不出来**，
      # 只有真人手点才撞得上（就是 #56 的来路），所以它得在 CI 里常驻而不是靠人记着查。
      - name: Bundle on-screen qualification (regular exec + plist-bound signature)
        run: php cmd/check-bundle-signature.php

      # 画廊（examples/showcase）已按功能域拆完并删除。它当年独占的四类证据各有主人：
      #   · 覆盖率反射 → tests/ExampleCoverageTest.php（php job，不需要原生）
      #   · 每支示例"没有错误节点、能力真有返回" → 下面 Domain examples 那圈循环
      #   · 首帧可点 + 导航逐行可达 → examples/chrome 的 navRowsReachable
      #   · 逐颗输入框打得进字 → examples/input 的 realTyping / keyDownRoute
      # 真人那一按（--wait-key）与 --trace 不在 CI 里：前者要人，后者要辅助功能权限，
      # 见 examples/input 的 --wait-key 与 cmd/real-input-probe.py。

      # 按功能域拆出来的独立示例（examples/<域>，hello 之外）：一支一个二进制，
      # yml 只列本域那一份源，所以它红的时候知道就是这一域的问题。
      # 上面的 build hello 已经把共用产物（补丁后的沙箱、gpui.o、libgpui_shim.a）建好了，
      # 所以这里用 --no-native 只跑 tpc 那一步，每支约 2s。完整链现在也不会重编 amalgam
      # （sync-upstream.sh 有上游指纹闸门，2026-10-19 实测完整链 6.5s、amalgam 1.41s），
      # 但每支仍要重付 shim 的 3.4s；省下来没有成本，所以维持 --no-native。
      # 新拆一支示例不用改这里：循环按 examples/*/project.macos.yml 自己找到它。
      - name: Domain examples（逐支编译 + --selftest）
        run: |
          # 这里**不用** `set -e`。教训来自 run 38682636928：那一步之前的画廊自检一红，
          # 整个作业中断，后面 12 支域的循环直接变 skipped —— "一步红"于是吞掉了整批证据，
          # 而从 run 页面看过去只看到一个红点，看不出还有十三个结论根本没跑。
          # 逐支记录、末尾汇总：红一支只欠一支的结论，其余照常出数。
          fails=""
          for yml in examples/*/project.macos.yml; do
            ex=$(basename "$(dirname "$yml")")
            case "$ex" in hello) continue ;; esac
            if ! php bin/gpui build "$ex" --no-native; then
              fails="$fails $ex(build)"
              continue
            fi
            echo "::group::$ex --selftest"
            if "./examples/$ex/build/$ex" --selftest; then
              echo "DOMAIN OK $ex"
            else
              fails="$fails $ex(selftest)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$fails" ]; then
            echo "::error::域示例失败:$fails"
            exit 1
          fi
          echo "DOMAIN LOOP OK"

      # 边界（不装）：这里跑的是**裸二进制**，所以 selftest 读数里 bundled=false，
      # bundleGreen/routeGreen 两道门在 CI 记为"未验"而不是"通过"——它们要的是
      # "有 .app 身份 → NSApp.isActive 起得来 → 事件缝走真 NSApp 路由"，而托管 runner
      # 能不能把 bundle 应用激活我没实测过，不该拿它赌 CI 绿。本地用
      # `php bin/gpui selftest hello`（走 bundle）覆盖这两道门，读数见 progress.md。

      # 注意：各示例的像素基线（php cmd/shotdiff.php check <域>）**不进 CI**，
      # 与 hello 同理——--shot 抓的是真在屏 NSView，托管 runner 没有窗口会话。
      # 覆盖率门禁（tests/ExampleCoverageTest.php）在 php job 里，它不需要原生。
