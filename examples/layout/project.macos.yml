name: gpui-layout
mode: bin
output: build/layout

# TypePHP GPUI — macOS arm64，nano 模式。功能域独立示例：容器、布局与滚动。
#
# 这一支量的是 #18 那轮定下来的一件事：滚动是 behavior（method op
# overflow_y_scroll / overflow_x_scroll / overflow_scroll，materialize.cpp:364），
# 不是 nullary style；而 flex_grow / flex_shrink / gap_x / gap_y / p / px 走的是 param_style。
# 三条通道各有一条门，名字对而通道错就是 #66 那种"看着能用、一个像素都不动"。
#
# sources 只列本域那份 feature 源（../_shared/features/layout.php）+ 共用状态表；
# 同一份文件也被画廊的 yml 收录，所以不存在第二份实现。
#
# nano 强制 c++17，shim 是 c++20 预编译库。一轮里第二支起用 --no-native。

sources:
  - src/main.php
  - ../_shared/state.php
  - ../_shared/features/layout.php
  - ../../src/App.php
  - ../../src/Element.php
  - ../../src/El.php
  - ../../php-src/gpui.stub.php
  - ../../cpp-src/gpui_bridge.cc

build-dir: build

cxx-std: c++17
optimize: 2

include-paths:
  - ../../cpp-src
  - ../../php-src

# 静态库绝对路径：tpc 不解析相对 ld-flags，故用 @ROOT@ 占位，由 `bin/gpui build`
# 在编译期替换为仓库绝对根并写到 project.macos.gen.yml。
ld-flags:
  - "@ROOT@/cpp-src/build/libgpui_shim.a"
  - -framework Cocoa
  - -framework CoreServices
  - -framework CoreText
  - -framework CoreGraphics
  - -framework ImageIO
  - -framework IOKit
  - -framework WebKit
  - -framework AudioToolbox
  - -framework AVFoundation
  - -framework Speech
  - -framework Metal
  - -framework QuartzCore
  - -framework Carbon
