name: gpui-style
mode: bin
output: build/style

# TypePHP GPUI — macOS arm64，nano 模式。功能域独立示例：样式、图标与弹层原语。
#
# 这一支接过来的是"47 个零参样式糖在**编出来的产物**里逐个调一遍"那条门：
# 它量的是 nano 那边每个方法都真编进去了（未编进去的动态调用是 SIGABRT 而不是异常，
# 只有跑产物能排掉）+ 每个方法确实发出一条 style:<上游名字>。过去它挂在画廊 selftest
# 中段，而画廊的报告只在末尾打印一次——所以它一旦崩，看见的只是"rc 非零、一个字没有"。
#
# sources 只列本域那份 feature 源（../_shared/features/styling.php）+ 共用状态表；
# 同一份文件也被画廊的 yml 收录，所以不存在第二份实现。
#
# nano 强制 c++17，gpui amalgam 与 shim 是 c++20，已预编译成 cpp-src/build/libgpui_shim.a。
# 一轮里第二支起用 `php bin/gpui build style --no-native`。改了 cpp-src/ 之后第一支必须走完整链。

sources:
  - src/main.php
  - ../_shared/state.php
  - ../_shared/features/styling.php
  - ../../src/App.php
  - ../../src/Element.php
  - ../../src/El.php
  - ../../php-src/gpui.stub.php
  - ../../cpp-src/gpui_bridge.cc

build-dir: build

cxx-std: c++17
optimize: 2

include-paths:
  - ../../cpp-src
  - ../../php-src

# 静态库绝对路径：tpc 不解析相对 ld-flags，故用 @ROOT@ 占位，由 `bin/gpui build`
# 在编译期替换为仓库绝对根并写到 project.macos.gen.yml。
ld-flags:
  - "@ROOT@/cpp-src/build/libgpui_shim.a"
  - -framework Cocoa
  - -framework CoreServices
  - -framework CoreText
  - -framework CoreGraphics
  - -framework ImageIO
  - -framework IOKit
  - -framework WebKit
  - -framework AudioToolbox
  - -framework AVFoundation
  - -framework Speech
  - -framework Metal
  - -framework QuartzCore
  - -framework Carbon
